<!DOCTYPE html>
<html>
<head>
<title>Subject Units</title>
<link rel="stylesheet" href="style.css">
<style>
body {
    font-family: Arial;
    margin: 0;
    background-color: #f5f7fa;
}

/* Header */
.header {
    background: linear-gradient(to right, #2ecc71, #27ae60);
    color: white;
    text-align: center;
    padding: 40px;
}

/* Content */
.content {
    padding: 40px;
    text-align: center;
}

/* Table Style */
table {
    margin: 0 auto;
    width: 60%;
    border-collapse: collapse;
    background-color: white;
}

th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background-color: #3498db;
    color: white;
}

tr:nth-child(even) {
    background-color: #f2f2f2;
}

tr:hover {
    background-color: #e6f2ff;
}

/* Links */
a {
    text-decoration: none;
    color: #3498db;
    font-weight: bold;
    display: block;
    width: 100%;
    height: 100%;
}

a:hover {
    color: #2c3e50;
}

/* Back Button */
.back {
    display: inline-block;
    margin-top: 30px;
    padding: 10px 20px;
    background-color: #3498db;
    color: white;
    border-radius: 5px;
    text-decoration: none;
}
</style>
<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="header">
    <h1 id="subject-title">Loading Subject...</h1>
    <p>Select a Unit</p>
</div>

<div class="content">
    <table id="units-table">
        <tr>
            <th>Unit Number</th>
            <th>Title</th>
        </tr>
        <!-- Units will be injected here -->
    </table>
    
    <a href="index.html" class="back">⬅ Back to Subjects</a>
</div>

<script>
    // Initialize Supabase
    const SUPABASE_URL = 'https://mmrodjsknmppzmqjrrgu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tcm9kanNrbm1wcHptcWpycmd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDAyNTQsImV4cCI6MjA5MjUxNjI1NH0.OyZd4tbbk26FYJ7HR_no-0-NlVVsuO-1HrywZtTUviQ';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Get subject ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const subjectId = urlParams.get('id');

    async function loadUnits() {
        if (!subjectId) {
            document.getElementById('subject-title').innerText = "Subject not found";
            return;
        }

        // Fetch subject details
        const { data: subjectData, error: subjectError } = await supabaseClient
            .from('subjects')
            .select('name')
            .eq('id', subjectId)
            .single();

        if (subjectData) {
            document.getElementById('subject-title').innerText = `💻 ${subjectData.name} Units`;
        }

        // Fetch units for this subject
        const { data: unitsData, error: unitsError } = await supabaseClient
            .from('units')
            .select('*')
            .eq('subject_id', subjectId)
            .order('unit_number', { ascending: true });

        const table = document.getElementById('units-table');
        
        if (unitsData && unitsData.length > 0) {
            unitsData.forEach(unit => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>Unit ${unit.unit_number}</td>
                    <td><a href="unit.html?unit_id=${unit.id}">${unit.title || 'View Topics'}</a></td>
                `;
                table.appendChild(tr);
            });
        } else {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td colspan="2">No units found or please configure Supabase credentials.</td>`;
            table.appendChild(tr);
        }
    }

    loadUnits();
</script>
</body>
</html>
