<!DOCTYPE html>
<html>
<head>
<title>Topic Questions</title>
<link rel="stylesheet" href="style.css">
<style>
body {
    font-family: Arial;
    margin: 0;
    background-color: #f5f7fa;
}

/* Header */
.header {
    background: linear-gradient(to right, #2ecc71, #27ae60);
    color: white;
    text-align: center;
    padding: 40px;
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: center;
    background-color: white;
    padding: 15px;
    box-shadow: 0px 2px 5px gray;
}

.navbar a {
    margin: 0 15px;
    text-decoration: none;
    color: #3498db;
    font-weight: bold;
}

/* Cards */
.cards {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 30px;
}

.card {
    background: linear-gradient(to right, #5dade2, #3498db);
    color: white;
    padding: 30px;
    width: 200px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0px 4px 10px gray;
}

/* Content */
.content {
    padding: 20px 50px;
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background: white;
    box-shadow: 0px 2px 8px gray;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background-color: #3498db;
    color: white;
}

tr:hover {
    background-color: #f1f1f1;
}

h2 {
    border-bottom: 2px solid #3498db;
    padding-bottom: 5px;
}

/* Back Button */
.back {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 25px;
    background-color: #3498db;
    color: white;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
}

.back:hover {
    background-color: #2c3e50;
}
</style>
<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- Header -->
<div class="header">
    <h1 id="topic-title">💻 Loading Topic...</h1>
    <p> Question Bank</p>
</div>

<!-- Navbar -->
<div class="navbar">
    <a href="#short-questions">Short Questions</a>
    <a href="#long-questions">Long Questions</a>
</div>

<!-- Cards -->
<div class="cards">
    <div class="card">
        <h2 id="short-count">0</h2>
        <p>Short Questions</p>
    </div>
    <div class="card">
        <h2 id="long-count">0</h2>
        <p>Long Questions</p>
    </div>
    <div class="card">
        <h2 id="total-count">0</h2>
        <p>Total Questions</p>
    </div>
</div>

<!-- Content -->
<div class="content">

<h2 id="short-questions">📄 Short Questions</h2>

<table id="short-table">
<tr><th>S.No</th><th>Question</th></tr>
<!-- Short questions injected here -->
</table>

<h2 id="long-questions">📘 Long Questions</h2>

<table id="long-table">
<tr><th>S.No</th><th>Question</th></tr>
<!-- Long questions injected here -->
</table>

<!-- Back Button -->
<a href="index.html" class="back" id="back-button">⬅ Back to Topics</a>

</div>

<script>
    // Initialize Supabase
    const SUPABASE_URL = 'https://mmrodjsknmppzmqjrrgu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tcm9kanNrbm1wcHptcWpycmd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDAyNTQsImV4cCI6MjA5MjUxNjI1NH0.OyZd4tbbk26FYJ7HR_no-0-NlVVsuO-1HrywZtTUviQ';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Get topic ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const topicId = urlParams.get('topic_id');

    async function loadQuestions() {
        if (!topicId) {
            document.getElementById('topic-title').innerText = "Topic not found";
            return;
        }

        // Fetch topic details
        const { data: topicData, error: topicError } = await supabaseClient
            .from('topics')
            .select('title, unit_id')
            .eq('id', topicId)
            .single();

        if (topicData) {
            document.getElementById('topic-title').innerText = `💻 ${topicData.title}`;
            document.getElementById('back-button').href = `unit.html?unit_id=${topicData.unit_id}`;
        }

        // Fetch questions for this topic
        const { data: questionsData, error: questionsError } = await supabaseClient
            .from('questions')
            .select('*')
            .eq('topic_id', topicId)
            .order('created_at', { ascending: true });

        const shortTable = document.getElementById('short-table');
        const longTable = document.getElementById('long-table');
        
        let shortCount = 0;
        let longCount = 0;

        if (questionsData && questionsData.length > 0) {
            questionsData.forEach(q => {
                const tr = document.createElement('tr');
                if (q.question_type === 'short') {
                    shortCount++;
                    tr.innerHTML = `<td>${shortCount}</td><td>${q.question_text}</td>`;
                    shortTable.appendChild(tr);
                } else if (q.question_type === 'long') {
                    longCount++;
                    tr.innerHTML = `<td>${longCount}</td><td>${q.question_text}</td>`;
                    longTable.appendChild(tr);
                }
            });
        } else {
            const trShort = document.createElement('tr');
            trShort.innerHTML = `<td colspan="2">No questions found.</td>`;
            shortTable.appendChild(trShort);

            const trLong = document.createElement('tr');
            trLong.innerHTML = `<td colspan="2">No questions found.</td>`;
            longTable.appendChild(trLong);
        }

        // Update cards
        document.getElementById('short-count').innerText = shortCount;
        document.getElementById('long-count').innerText = longCount;
        document.getElementById('total-count').innerText = shortCount + longCount;
    }

    loadQuestions();
</script>
</body>
</html>
